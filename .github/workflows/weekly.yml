name: Weekly Wealth Article Generator

on:
  schedule:
    # Runs every Friday at 8:00 AM UTC
    - cron: '0 8 * * 5' 
  workflow_dispatch: # Allows manual testing

jobs:
  generate-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # THIS IS THE FIX: Installs the Rust compiler needed for the search tool
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python agent.py

      - name: Commit and Push Article
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add articles/
          git diff --staged --quiet || git commit -m "Add weekly ethical wealth article"
          git push
